        - '<gray>Tu zakładasz i zdejmujesz zdobyte części.</gray>'
      command: 'kosmetyki'
      required-plugin: ''
    forge:
      slot: 32
      material: ANVIL
      name: '<white><font:wpme:icons></font></white> <gold><bold>Kuźnia i kantor</bold></gold>'
      lore:
        - '<gray>Ulepszenia, talizmany i minionki za monety.</gray>'
        - '<gray>W kantorze wymienisz Złote Lotosy na klucze.</gray>'
      command: 'kuznia'
      required-plugin: ''

# Plac startowy jest zarządzany jawnie przez SkyBlockGameplay. Dzięki temu
# wejście z Velocity, /spawn, hologramy i skocznia korzystają z jednego układu
# współrzędnych zamiast zależeć od zapisanej pozycji ostatniego wylogowania.
hub:
  teleport-on-join: true
  # Blokuje kopanie, stawianie i wylewanie wiader w świecie spawnu. Wyspy leżą
  # w osobnych wymiarach sky-*, więc dotyczy to wyłącznie hubu. Obejście:
  # uprawnienie skyblockgameplay.admin.
  protect-spawn: true
  disable-hunger: true
  invulnerable: true
  heal-on-entry: true
  spawn:
    world: world
    x: 27.5
    y: 99.0
    z: 1.5
    yaw: 90.0
    pitch: 0.0
  onboarding:
    delay-ticks: 40
    # Pierwsze wejście pokazuje tytuł i krótkie wskazówki. GUI nie wyskakuje
    # samoczynnie; gracz otwiera je świadomie przez NPC albo /menu.
    open-menu-on-first-join: false
    # Natomiast dialog /pomoc otwiera się przy pierwszym wejściu (gdy menu się
    # nie otworzyło) — nowy gracz dostaje mapę serwera bez szukania komendy.
    # Przy błędzie klienta fallback wypisuje wersję czatową.
    open-help-dialog-on-first-join: true
  # Hologramy huba przeniesione do FancyHolograms 2026-08-31. Sekcji NIE MA
  # celowo: ConfigUpdater dopisuje kazdy klucz brakujacy wzgledem tego pliku,
  # wiec zostawienie jej tutaj odtwarzaloby drugi komplet napisow na kazdym
  # serwerze przy najblizszym starcie. Definicje: plugins/FancyHolograms/holograms.yml
  jump-pads:
    arrival-strip:
      world: world
      plate-material: LIGHT_WEIGHTED_PRESSURE_PLATE
      # Pięć pól u stóp schodów na taras, na osi placu (z=1.5). Instalator
      # stawia płytki tylko w powietrzu nad pełnym blokiem i nigdy nie
      # nadpisuje dekoracji mapy.
      blocks:
        - {x: 21, y: 99, z: -1}
        - {x: 21, y: 99, z: 0}
        - {x: 21, y: 99, z: 1}
        - {x: 21, y: 99, z: 2}
        - {x: 21, y: 99, z: 3}
      velocity:
        x: -2.0
        y: 0.9
        z: 0.0
      cooldown-ms: 1600

island:
  # ── Prestiż wyspy: powtarzalny zlew monet dla weterana ────────────────────
  # Po skończeniu 5 petów i pełnej kuźni monety nie miały celu (audyt faz
  # 2026-09-10: jedynym powtarzalnym zlewem był Klucz Wolframowy o EV 0,64).
  # Prestiż daje tytuł wyspy (widoczny w Centrum Wyspy i w
  # `%skyblock_island_title%`) plus małe mechaniczne perki — bez zwrotu monet
  # i bez punktów sezonowych, więc nie drukuje sam siebie. Koszt
  # `base-cost × cost-multiplier^(poziom-1)` płaci się z KONTA WYSYP, więc
  # wpłaty członków mają stały cel: 10 poziomów ≈ 27,5 mln monet (2× pełna
  # ścieżka kuźni 12,75 mln) — zlew na sezon, nie na wieczór.
  #
  # Perki (od 2026-09-20): `minion-slots-every-levels` — +1 slot minionka co
  # N poziomów (2 → +5 slotów przy 10); `crystal-luck-percent-per-level` —
  # % bonusu do szans gameplay-drops za poziom (4% × 10 = +40% szans).
  #
  # Wysyłany zasób ma `enabled: false` celowo: zlew monet to decyzja per tryb
  # (prod SkyBlock ma `true` świadomie, patrz wpis `zamierzone` w
  # scripts/wpme-config-diff-ignore.yml). Brak sekcji = prestiż cichnie
  # wyłączony (IslandPrestige.Settings.load jest fail-closed), więc zasób musi
  # nieść sekcję, żeby świeża instalacja nie wstała bez funkcji.
  prestige:
    enabled: false
    max-level: 10
    base-cost: 250000
    cost-multiplier: 1.6
    minion-slots-every-levels: 2
    crystal-luck-percent-per-level: 4
    title-per-level:
      - '<gray>Osada</gray>'
      - '<white>Wioska</white>'
      - '<green>Miasto</green>'
      - '<aqua>Metropolia</aqua>'
      - '<blue>Forteca</blue>'
      - '<light_purple>Latarnia</light_purple>'
      - '<gold>Złota Wyspa</gold>'
      - '<red>Wulkan</red>'
      - '<dark_purple>Otchłań</dark_purple>'
      - 'Legenda Wysp'
  modes:
    classic:
      enabled: true
    oneblock:
      enabled: true
    expedition:
      enabled: false

  # SKY-1: paste schematów przy tworzeniu wyspy. SkylliaAPI.createIsland NIE
  # wkleja schematu (robi to tylko własny /is create Skylli) — bez tego każda
  # wyspa jest void. Szablony JSON Skylli czytane z folderu danych pluginu
  # Skyllia; nadpisuj per tryb/świat w templates.<tryb>.<świat>.
  paste:
    enabled: true
    templates:
      classic:
        sky-overworld: schematics/starter-overworld.json
        sky-nether: schematics/starter-nether.json
        sky-end: schematics/starter-end.json
      oneblock:
        sky-overworld: schematics/oneblock-overworld.json
        sky-nether: schematics/starter-nether.json
        sky-end: schematics/starter-end.json

# ── Eventy rotacyjne ──────────────────────────────────────────────────
# Timowane okna boostów z ogłoszeniami na czacie — powód do powrotu gracza.
# Rozkład jest DETERMINISTYCZNY od `epoch` (ISO-8601 UTC): cykl = suma
# (duration-minutes + gap-minutes) wszystkich pozycji, a pozycja w cyklu
# liczona jest z zegara — restart serwera nie resetuje harmonogramu i nie
# ogłasza eventu ponownie. Tick co 10 s, ogłoszenie start/koniec raz.
# Mnożniki łączą się multiplikatywnie z innymi bonusami (prestiż, weekend).
events:
  # Zasób domyślnie off (prod włącza świadomie); brak/zła epoka = wyłączone.
  enabled: false
  epoch: '2026-09-20T00:00:00Z'
  rotation:
    - id: goraczka-krysztalow
      name: 'Gorączka Kryształów'
      duration-minutes: 30
      gap-minutes: 150
      # ×2 szans na kryształy z rozgrywki (kopanie/hodowla/łowienie/moby).
      crystal-luck: 2.0
      season-points: 1.0
      announce-start: '<gold><bold>Gorączka Kryształów!</bold></gold> <gray>Przez 30 minut szansa na kryształy jest podwojona — kop, hoduj, walcz i ław.</gray>'
      announce-end: '<gray>Gorączka Kryształów dobiegła końca.</gray>'
    - id: sprint-sezonowy
      name: 'Sprint Sezonowy'
      duration-minutes: 30
      gap-minutes: 150
      crystal-luck: 1.0
      # ×2 punkty sezonu z każdej nagrody (zadania dnia, ryby, misje).
      season-points: 2.0
      announce-start: '<aqua><bold>Sprint Sezonowy!</bold></aqua> <gray>Przez 30 minut punkty sezonu liczą się podwójnie — robimy zadania dnia.</gray>'
      announce-end: '<gray>Sprint Sezonowy dobiegł końca.</gray>'

# ── Sezony ─────────────────────────────────────────────────────────────
# Spec: docs/spec/sezony-rankingi.md. Wyspy bez wipe; punkty per gracz.
# Cykl życia sezonu jest w pełni manualny: reset to wyłącznie komenda operatora
# `/sezon zamknij --confirm` (snapshot → nagrody raz przez outbox → rollover
# wewnętrznego season_id → czyste punkty). ZERO auto-zamykania: po minięciu
# końca sezonu UI pokazuje „sezon wygasł — czeka na zamknięcie”, aż operator
# zamknie. Publicznie nie ma numerów sezonu: UI i lore kosmetyków pokazują
# ZAKRES DAT sezonu (format dd.MM.yyyy, np. „01.09 – 27.10.2026”); numeracja
# S<n> żyje tylko wewnętrznie w DB/PDC i ledgerach (dedupe, kolekcje).
season:
  enabled: true
  # Długość sezonu w dniach; walidator przy starcie: 42..70 (poza zakresem
  # plugin odmawia startu — fail-closed, SEVERE + disable).
  length-days: 56
  # Koniec sezonu = epoch-start + length_days; kolejne sezony przesuwają się
  # o kolejne wielokrotności długości względem WEWNĘTRZNEGO season_id z DB
  # (nigdy nie pokazywanego graczom).
  # epoch-start to dowolny punkt w czasie; zmiana unieważnia licznik sezonów!
  # Musi być poprawnym ISO-8601 UTC (Instant.parse) — błąd formatu = fail-closed.
  epoch-start: '2026-09-05T00:00:00Z'
  # Weekendowy mnożnik punktów sezonowych (sob+nie, Europe/Warsaw). 1.0 = off.
  # Zmiana wymaga restartu; aktywację ogłaszaj na hologramach/TAB (brak auto-ogłoszenia).
  weekend-points-multiplier: 1.2
  # F20: koszt aktywacji toru premium karnetu w Złotych Lotosach z ekwipunku.
  # Walidacja: 1..64 (stack); poza zakresem → ostrzeżenie i wartość domyślna 6.
  # Rachunek: sezon 56 dni = 8 tygodni. Darmowe źródła Złotego Lotosa to
  # tygodniowy kamień milowy zadań (15 zadań = 1 lotos, czyli 8 na sezon),
  # Skrzynia Podziemi (4 %, ~1,3), Skrzynia Tytanów (8 % × 2 szt., ~0,8)
  # i kamienie milowe OneBlocka (~3,8, ale dopiero po 5000 bloków i tylko na
  # wyspie OneBlock). Realnie ~6-9 na wyspie klasycznej. Sześć = sześć
  # tygodniowych kamieni milowych = ¾ sezonu. Poprzednia wartość 32 to cztery
  # sezony, czyli tor premium nieosiągalny w sezonie, dla którego istnieje.
  # Sklep 2b2t.pl NIE ma SKU na Złoty Lotos ani na karnet, więc ta cena nie
  # chroni żadnego przychodu — jest wyłącznie balansem.
  pass:
    premium-lotus-cost: 6
    # Migracja Eco: id karnetu w EcoBattlepass (plik battlepasses/<id>.yml), któremu zakup
    # premium za lotosy ustawia tor premium komendą `ecobattlepass setpremium`. Pusty = wyłączone.
    eco-battlepass-id: battlepass
  # USUNIĘTE (F29): `season.catch-up.*`, `season.unlock-thresholds`
  # i `season.slots-per-threshold`. Nie czytał ich żaden kod — te liczby żyją
  # wyłącznie jako stałe w DefaultSeasonPointService (CATCH_UP_MULTIPLIER,
  # CATCH_UP_LAST_DAYS, UNLOCK_THRESHOLDS, SLOTS_PER_TIER), a config je tylko
  # udawał: wpisanie tu innej wartości nie zmieniało niczego w grze.
  #
  # Dowód nie jest grepem po literałach (ten sam grep uznał kanoniczne `wpme.*`
  # za martwe). Bajtkod wdrożonego SkyBlockGameplay-1.0-SNAPSHOT.jar, 340 klas:
  #   1. zero stałych `unlock-thresholds` / `slots-per-threshold` / `catch-up`;
  #   2. zero stałych zawierających `unlock-`, `-threshold`, `catch-` — więc
  #      żadna sklejka (makeConcatWithConstants ani StringBuilder) nie ma
  #      z czego złożyć tych ścieżek; `-days` istnieje tylko jako `length-days`
  #      i `retention-days`;
  #   3. podobne, ŻYWE klucze należą do innych sekcji i nie wolno ich mylić:
  #      `slots-per-tier-increase` i `storage-slots` (bank), `speed-multiplier`
  #      (minionki), a `catch-up` w EvenMoreFish/messages.yml to cudzy komunikat;
  #   4. sekcję `season` czytają dokładnie cztery miejsca (SeasonSchedule.load,
  #      SeasonLabels.window*, SkyBlockSettings.loadTopRewards oraz osobne
  #      ścieżki `season.quests` / `season.fish-points` / `season.pass.*`)
  #      i żadne z nich nie woła getKeys(false) na `season` — klucz w tej sekcji
  #      nie da się odczytać generycznie.
  # Poza jarem też nikt ich nie trzyma: ani drugi serwer, ani 2b2tbridge,
  # ani strona, ani scripts/, ani docs/.
  #
  # NIE dopisuj ich z powrotem „na zapas”: ConfigUpdater dosypuje brakujące
  # klucze z zasobu, więc wpis tutaj wraca na produkcję i znowu udaje pokrętło.
  # Progi odblokowań mają sens dopiero przy katalogu dłuższym niż jeden tier —
  # `season.quests.definitions` wysyła PIĘĆ questów, a pierwszy próg (0 pkt)
  # otwiera osiem slotów. Gdyby progi kiedyś miały być sterowalne z configu,
  # trzeba je najpierw WCZYTAĆ w DefaultSeasonPointService, a dopiero potem
  # opisać w tym pliku.
  # Nagrody za miejsca w TOP 3 rankingu sezonu (wydawane po zamknięciu
  # edycji przez operatora). rank = miejsce w rankingu, lotus = liczba
  # Diamentowych Lotosów (skyblock:token/diamond_lotus), coins = monety.
  # Walidacja: rank dodatni i unikalny, lotus >= 0, coins >= 0; obce klucze
  # ignorowane. Brak sekcji = wbudowane wartości domyślne jak poniżej.
  top-rewards:
    - { rank: 1, lotus: 3, coins: 50000 }
    - { rank: 2, lotus: 2, coins: 30000 }
    - { rank: 3, lotus: 1, coins: 15000 }
    # P2-4: rank 4 = próg sezonu (seasons.threshold-score) dla wysp poza podium.
    - { rank: 4, lotus: 1, coins: 5000 }
    # 2026-09-10: głębsze miejsca też coś dostają. TOP 10 = 1 część kolekcji
    # (cosmetics.yml top-rewards.10), TOP 50 = tytuł wyspy (title-rewards).
    # Zera w monetach i Lotosach są celowe: nagroda jest kosmetyczna, nie balansowa.
    - { rank: 10, lotus: 0, coins: 0 }
    - { rank: 50, lotus: 0, coins: 0 }
  # Tytuły wyspy za miejsce w rankingu sezonu (MiniMessage, ≤64 znaków).
  # Nadawane przy odbiorze nagrody (seasons.rewards-claimable), zapisywane
  # trwale (wpme_sb_island_titles) i widoczne w Centrum Wyspy oraz w placeholdzie
  # %skyblock_island_title%. Tytuł nie daje żadnych bonusów — to kosmetyk.
  # Brak sekcji/pusta mapa = żadnych tytułów.
  title-rewards:
    10: "<gray>Zasłużony dla wysp</gray>"
    50: "<gray>Weteran Wysp</gray>"
  # Punkty sezonowe za ryby z EvenMoreFish (rzadkość → punkty). Sekcja
  # OBOWIĄZKOWA: muszą być wszystkie cztery rzadkości EMF, wartości > 0;
  # brak sekcji, brakująca rzadkość albo zła wartość = fail-closed
  # (SEVERE + disable), bez fallbacku do stałych w kodzie.
  fish-points:
    common: 5
    rare: 15
    epic: 40
    legendary: 120
  # ── Dzienny sufit punktów sezonowych per kanał ────────────────────────────
  # Po co: ranking sezonowy ruszał wyłącznie wędką (ryby są jedynym źródłem bez
  # limitu), a po jednorazowych questach gracz nie miał po co wracać. Capujemy
  # więc każdy kanał, żeby żadnego nie dało się farmić na okrągło.
  #
  # Wyprowadzenie (2026-09-10):
  #   kotwica: legendarna ryba = 120 pkt (season.fish-points.legendary),
  #   karnet: poziom 28 = 1400 pkt (SeasonPassService), nadwyżka co 500 pkt,
  #   questy jednorazowe: 43 szt. = 7350 pkt na cały sezon (trzon, bez zmian),
  #   cel: aktywny dzień ≈ 400–500 pkt → bonusowy poziom ~1 dziennie,
  #        karnet 28 osiągalny w kilka dni i to nie jednym kanałem.
  # fish  300 ≈ 2,5 legendarnej ryby na dobę — wędka zostaje najlepsza na
  #               krótką sesję, ale przestaje być jedyną drogą.
  # quest 100 = 4 zadania dnia po 25 pkt (EcoQuests woła
  #               `/sezon admin punkty-dzien`; task-amount: 4 od 2026-09-20,
  #               wcześniejszy cap 75 odcinał punkty z czwartego zadania —
  #               gracz widział „+25 pkt sezonu”, a dostawał 0).
  # 0 albo brak kanału = bez limitu. Wartości są pokrętłem balansu — po pierwszym
  # tygodniu sezonu zmierz P3-3 i dostrój, nic więcej nie trzeba ruszać.
