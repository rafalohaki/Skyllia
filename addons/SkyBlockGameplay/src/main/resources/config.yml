    # 2026-09-21: kuźnia i kolekcja sezonowa nie miały ŻADNEGO wejścia z /menu —
    # ta sama usterka co sezon w F24 (jedyne dojście = komenda na ślepo).
    # Kafelek kosmetyki siada obok sezonu (28), kuźnia w rzędzie progresji (32);
    # oba sloty są wolne — rezerwacje i zajęte pozycje jak wyżej.
    collection:
