# SkyBlockGameplay jest warstwą rozgrywki nad Skyllią. Skyllia pozostaje
# jedynym właścicielem wysp, ról i ochrony; ten plugin prowadzi ekonomię,
# bank zespołu, sklep, zadania oraz narzędzia.

database:
  # Osobna baza i pojedyncze połączenie ograniczają domenę awarii. SQLite jest
  # właściwe dla jednego serwera staging/production; nie współdziel tego pliku
  # przez NFS ani między kilkoma instancjami.
  # T3b: trwałość siedzi W URL-u — driver stosuje parametry jako PRAGMAs przy
  # każdej connections z puli (per-connection PRAGMAs w migratorze giną na
  # recyklingu połączeń Hikari): journal_mode=WAL + synchronous=FULL.
  jdbc-url: 'jdbc:sqlite:plugins/SkyBlockGameplay/skyblock-gameplay.db?busy_timeout=5000&foreign_keys=on&journal_mode=WAL&synchronous=FULL'
  pool:
    # 2 wystarcza dla ~50 graczy na SQLite (WAL: czytania równoległe, pisze jedno).
    # Przy migracji na PostgreSQL podnieś do 8-16 (PG dobrze skaluje połączenia).
    maximum-pool-size: 2
    minimum-idle: 1
    # Jawny backpressure: executor SQL nie może rosnąć bez limitu podczas laga DB.
    queue-capacity: 256
    connection-timeout-ms: 5000
    idle-timeout-ms: 0
    max-lifetime-ms: 0

# ── Kontrakt balansowy całej ekonomii ───────────────────────────────────────
# F14: sekcja czytana WYŁĄCZNIE przez bramkę budowania (testy *EconomyBalance*),
# nigdy przez runtime — tak samo jak `balance` w oneblock.yml i minions.yml.
#
# Trzy liczby, które dotąd były rozsypane po komentarzach trzech fal (F7, F8)
# albo nie istniały wcale.
balance:
  # Tempo docelowe: ile monet na godzinę ma zarabiać AKTYWNY GRACZ BEZ RANGI,
  # licząc najlepszy kanał ręczny plus to, co idzie równolegle. Liczba pochodzi
  # z hub/SkyBlockProgressiveObjectiveService.java:152,158 — przy saldzie
  # 25 000 coins gracz zamyka etap 10 „Bogata wyspa”. Godzina aktywnej gry ma
  # dawać jedną bogatą wyspę (wyprowadzenie: F7, rozdział 1).
  target-coins-per-hour: 25000
  # Tempo odniesienia: jedna akcja gracza (rozbicie, formowanie, zbiór) na
  # sekundę. Ta sama konwencja co generator.balance.reference-forms-per-hour.
  reference-actions-per-hour: 3600
  # SUFIT NARZĘDZIA, nie przypadek bazowy. Do F13 wszystkie trzy bramki
  # balansowe liczyły waniliowe łupy BEZ Fortuny, a Fortuna III mnoży drop rudy
  # 2,20× (formuła ore_drops), lapis i miedź tak samo, redstone i brodawkę
  # +bonus jednostajny, a marchew/ziemniak/nasiona 2,0× (binomial_with_bonus).
  # Sufit III jest twardy i sprawdzony na tym serwerze:
  #   data/minecraft/enchantment/fortune.json -> max_level: 3
  #   config/canvas-server.yml -> enchant-command.uncap-max-level: false
  # 0 wyłącza modelowanie Fortuny (stan sprzed F14 — nie używać).
  fortune-level: 3

economy:
  # Jednostki są całkowite: Vault zgłasza fractionalDigits=0.
  starting-balance: 100

