  title: '<white><font:wpme:icons></font></white> <gold><bold>SkyBlock</bold></gold> <dark_gray>•</dark_gray> <gold><bold>Centrum gry</bold></gold>'
  external-actions:
    island:
      slot: 20
      material: GRASS_BLOCK
      name: '<white><font:wpme:icons></font></white> <green><bold>Twoja wyspa</bold></green>'
      lore:
        - '<gray>Nie masz jeszcze wyspy? Kliknij, aby ją założyć.</gray>'
        - '<gray>Masz? Kliknij, aby się na nią przenieść.</gray>'
      command: 'is'
      required-plugin: 'Skyllia'
    team:
      slot: 24
      material: PLAYER_HEAD
      name: '<white><font:wpme:icons></font></white> <gold><bold>Zespół wyspy</bold></gold>'
      lore:
        - '<gray>Kto jeszcze gra na Twojej wyspie.</gray>'
        - '<dark_gray>Zapraszasz komendą /is invite nick</dark_gray>'
      command: 'is info'
      required-plugin: 'Skyllia'
    # F24: sezon nie miał w Centrum gry ŻADNEGO wejścia — ani kafelka, ani
    # wzmianki w powitaniu, na tablicy bocznej czy w ogłoszeniach na czacie.
    # Jedyną drogą do /sezon i /przepustka było wpisanie ich na ślepo.
    # Kafelek uruchamia /sezon (przegląd + wykaz zadań sezonowych), bo to on
    # odpowiada na pytanie „o co tu chodzi”; sama tabela 28 poziomów siedzi
    # pod /przepustka, a /sezon do niej odsyła.
    # Slot 29 jest wolny: 4/11/13/15/22/31/33/40 są zarezerwowane w kodzie
    # (SkyBlockSettings.RESERVED_MENU_SLOTS), 20 i 24 zajmują kafelki wyżej,
    # a 30 i 35 nadpisałby SkyBlockMenus.open.
    season:
      slot: 29
      material: NETHER_STAR
      name: '<white><font:wpme:icons></font></white> <light_purple><bold>Sezon i karnet</bold></light_purple>'
      lore:
        - '<gray>Sezon trwa osiem tygodni i ma własny ranking.</gray>'
        - '<gray>Zadania sezonowe robisz raz na sezon — to rozbieg.</gray>'
        - '<gray>Dalsze punkty daje łowienie ryb, bez limitu.</gray>'
        - '<gray>Za punkty rosną poziomy karnetu z nagrodami.</gray>'
        - '<dark_gray>Sam karnet otworzysz komendą /przepustka</dark_gray>'
      command: 'sezon'
