      # questa bez klucza są uniwersalne (aktywne w każdej edycji).
      # Questy pakietowe NIE zajmują slotów odblokowań: są osobną listą
      # „zadań eventu” bez progów, widoczną tylko w oknie edycji.
      # Kolejność definicji UNIWERSALNYCH = kolejność slotów odblokowań:
      # 5 progów × 8 questów (DefaultSeasonPointService.UNLOCK_THRESHOLDS
      # 0/300/800/1600/3000).
      # Suma punktów każdego progu musi wystarczyć na odblokowanie następnego
