# Generator bruku i rud — konfiguracja szans na wydropienie danych surowców
# z generatorów wodno-lawowych na wyspach.
generator:
  # F8: sekcja czytana WYŁĄCZNIE przez bramkę budowania
  # (GeneratorEconomyBalanceTest), nigdy przez runtime — tak samo jak `balance`
  # w oneblock.yml i minions.yml.
  balance:
    # Tempo odniesienia przyjęte w F7: jedno formowanie na sekundę. Wszystkie
    # liczby „coins/h” w komentarzach niżej są liczone tym tempem.
    reference-forms-per-hour: 3600
    # Sufit tempa CAŁEGO generatora: rudy zwykłe + rzadkie + kryształ.
    # 12 500 = połowa tempa docelowego 25 000 coins/h (oneblock.yml:balance).
    #
    # Dlaczego połowa. Generator jest jedynym źródłem bez warunku wstępnego:
    # kosztuje wiadro lawy, działa od pierwszej minuty, w nieskończoność i pod
    # autoklikerem. Rozdział endgame'owy OneBlocka (`kres`, 6 000 bloków
    # progresji) daje 26 129 coins/h, a pierwszy rozdział (`poczatek`) 11 376.
    # Generator siada na wysokości pierwszego rozdziału, więc przejście całej
    # progresji OneBlocka podwaja tempo. Zawsze dostępne dno ekonomii nie może
    # bić treści, do której trzeba dojść.
    max-coins-per-hour: 12500
  ores:
    enabled: true
    # F8: okno na KAŻDĄ podmianę na rudę, liczone na chunk. Wagi w `rates`
    # decydują, CO wypadnie; to okno decyduje, JAK CZĘSTO — i to ono, a nie
    # wagi, trzyma tempo. W wagach nie ma liczby, która mówi „na godzinę”:
    # przychód generatora to (formowań/s) × (wartość formowania), a pierwszego
    # czynnika config dotąd w ogóle nie dotykał. Audyt zmierzył ~2 formowania/s
    # (A3, AUTO-7), a wyspa z zespołem bije w jedną ścianę generatorów kilkoma
    # parami rąk naraz — każda z nich mnożyła tempo liniowo.
    #
    # Wyliczenie: 3600/20 = 180 trafień rudy/h na chunk. Wartość oczekiwana
    # jednego trafienia po cenach skupu (`shop`) to 1696/45 = 37,69 coins —
    # lapis liczony razem z Opalem Astralnym, którego dokłada
    # gameplay-drops.lapis.opal. Daje to 6 784 coins/h z rud. Pozostałe
    # formowania to bruk: (3600 − 180) × 1 = 3 420 coins/h. Z kryształem
    # (1 800) całość wychodzi 12 004 coins/h, pod balance.max-coins-per-hour.
    #
    # 0 wyłącza okno.
    #
    # F14: 20 -> 40. Okno liczy TRAFIENIA, a nie monety, więc nie widziało
    # Fortuny. Kilof z Fortuną III mnoży drop rudy 2,20× (formuła ore_drops z
    # waniliowej tabeli łupów), przez co te same 180 trafień/h dawało nie 6 784,
    # a 14 322 coins/h i cały generator wychodził na 19 542 coins/h — 1,56×
    # ponad własny sufit z balance.max-coins-per-hour. 3600/40 = 90 trafień/h
    # daje 7 161 coins/h z rud, 3 510 z bruku i 1 800 z kryształu = 12 471,
    # czyli tuż pod sufitem 12 500 — przy NAJLEPSZYM narzędziu w grze.
    ore-cooldown-seconds: 40
    # AUTO-7: węższe okno WEWNĄTRZ ore-cooldown-seconds, wyłącznie na rudy
    # RZADKIE (złoto/diament/szmaragd/ancient debris). Liczone na chunk, nie na
    # blok — inaczej stack generatorów w jednym miejscu mnoży podaż liniowo.
    #
    # Wyliczenie z F7: wartość oczekiwana jednego trafienia rzadkiego to
    # (5×35 + 1,5×250 + 0,5×200)/7 = 92,9 coins, a rzadkie rudy mają dokładać
    # najwyżej ~10 % docelowego tempa 25 000 coins/h → 27 trafień/h → jedno na
    # ~134 s, zaokrąglone do 120 s.
    #
    # F8: przy ore-cooldown-seconds = 20 to okno już nie wiąże — 180 trafień/h
    # razy 7/45 udziału rud rzadkich daje 28 rzadkich/h przy limicie 30.
    # Zostaje jako drugi, węższy strażnik: gdyby ktoś podniósł wagi rud
    # rzadkich, zadziała bez przeliczania czegokolwiek innego.
    #
    # 0 wyłącza cooldown.
    rare-cooldown-seconds: 120
    # F8: wag nie ruszamy. One ustawiają SKŁAD trafienia (klimat generatora),
    # a tempo trzyma ore-cooldown-seconds. Podniesienie wagi drogiej rudy dalej
    # podnosi wartość oczekiwaną trafienia i wywróci bramkę balansową.
    rates:
      COBBLESTONE: 55.0
      COAL_ORE: 15.0
      COPPER_ORE: 10.0
      IRON_ORE: 8.0
      GOLD_ORE: 5.0
      REDSTONE_ORE: 3.0
      LAPIS_ORE: 2.0
      DIAMOND_ORE: 1.5
      EMERALD_ORE: 0.5
      # F27: netheryt nie miał na SkyBlocku ŻADNEGO źródła poza wyspą OneBlock.
      # Światy wysp Skyllii są puste — `generator = "default"` w worlds.toml to
      # VoidWorldGen (bajtkod `WorldsManager.registerGenerators`, mapa
      # default/ocean/bedrock → Void/Ocean/Bedrock), więc `sky-nether` nie ma
      # ani jednego bloku terenu, a tym samym ani jednej ancient debris.
      # Skutkiem był zakleszczenie: Płyta Wzmocniona wymaga NETHERITE_INGOT,
      # a jedyne pozostałe źródło netherytu to Skrzynia Tytanów (6 %), którą
      # otwiera Klucz Wolframowy — wykuwany właśnie z Płyty Wzmocnionej.
      # Na wyspie KLASYCZNEJ blokowało to cztery najdroższe pozycje w grze:
      # Płytę Wzmocnioną (34,1 h), Klucz Wolframowy (44,2 h), Napierśnik
      # Otchłani (46,6 h), Złoty Lotos (49,0 h) i minionka diamentu (86,8 h).
      #
      # Waga 0,4 przy rare-cooldown-seconds: 120 daje 0,79 ancient debris/h,
      # czyli 5,1 h na jedną sztabkę netherytu (4 odłamki) — dokładnie tyle,
      # ile ma kosztować składnik pozycji 34-godzinnej.
      #
      # Wpływ na sufit tempa jest UJEMNY, nie dodatni: ancient debris nie ma
      # ceny skupu, a wchodzi do puli rud rzadkich (isRareMaterial), więc
      # rozcieńcza złoto/diament/szmaragd. Generator schodzi z 12 471 na
      # 12 408 coins/h przy suficie 12 500.
      ANCIENT_DEBRIS: 0.4
  custom-drops:
    enabled: true
    # F8: okno na drop z generatora, liczone na chunk — ten sam wzorzec co
    # ore-cooldown-seconds. 3600/240 = 15 dropów/h, czyli tuż nad tym, co przy
    # tempie odniesienia dają szanse niżej (0,1 + 0,3 = 0,4 % × 3600 = 14,4).
    # Przy normalnej grze okno nie zmienia więc nic; przy szybszym kopaniu
    # trzyma sufit, zamiast mnożyć go liniowo.
    #
    # 0 wyłącza okno.
    cooldown-seconds: 240
    # Szansa procentowa (np. 0.1 = 0.1%) na dodatkowy drop w Overworldzie (Y > 0)
    #
    # F8: kryształ ma cenę skupu (cytryn 500, onyks 800, topaz 700), więc jest
    # przychodem, a nie dekoracją — i nie policzyła go dotąd żadna fala. Przy
    # 0,8 % dawał 0,8 % × 3600 × 500 = 14 400 coins/h, czyli 58 % całego tempa
    # docelowego z jednej linijki configu. Reguła jest ta sama co przy
    # minionkach (minions.yml:balance.bonus-share-max): kryształ to najwyżej
    # ~20 % przychodu swojego źródła, tutaj 0,50 coins na formowanie = 1 800
    # coins/h = 15 % sufitu generatora.
    #
    # Wzór: szansa[%] = 100 × 0,50 / cena skupu ze `shop`.
    #
    # Surowce kuźni (raw_tungsten, raw_umber) zostają nietknięte: nie mają ceny
    # skupu, więc nie są przychodem, a odmierzają tempo łańcucha płyt i kluczy
    # (jeden Klucz Wolframowy to 32 sztuki surowego wolframu).
    overworld:
      "skyblock:crystal/citrine": 0.1
      "skyblock:metal/raw_tungsten": 0.3
    # Szansa procentowa na dodatkowy drop w warstwie Deepslate (Y <= 0).
    # Wypełniaczem jest tu bruk deepslate, którego sklep NIE skupuje, więc ta
    # warstwa nie ma dochodu z tła — mimo to onyks trzyma ten sam budżet, żeby
    # nie opłacało się przenosić generatora pod Y=0 wyłącznie dla kryształu.
    deepslate:
      "skyblock:crystal/onyx": 0.06
      "skyblock:metal/raw_umber": 0.2
    # Szansa procentowa na dodatkowy drop w Netherze. Nether nie ma podmiany
    # rud (listener robi ją tylko w NORMAL) ani sprzedawalnego wypełniacza
    # (bazaltu sklep nie skupuje), więc topaz jest tam CAŁYM przychodem
    # generatora: 0,07 % × 3600 × 700 = 1 764 coins/h.
    nether:
      "skyblock:crystal/topaz": 0.07

# Dropy z aktywności rozgrywki (łowienie ryb, zbiory plonów, rudy lapisu, potwory)
gameplay-drops:
  enabled: true
  # F14: sekcja czytana WYŁĄCZNIE przez bramkę budowania
  # (GameplayDropsEconomyBalanceTest), nigdy przez runtime.
  balance:
    # Sufit tempa rolnictwa: plon + perydot, przy tempie odniesienia i przy
    # Fortunie III. 18 000 = 72 % tempa docelowego. Rolnictwo siada MIĘDZY
    # generatorem (12 500, warunek wstępny: wiadro lawy) a rozdziałem
    # endgame'owym OneBlocka (24 400, warunek wstępny: 6 000 bloków), bo
    # farma to realna inwestycja w budowę, ale nie progresja.
    max-coins-per-hour: 18000
  # F14: okno tempa na chunk — dokładnie ten sam wzorzec co
  # generator.custom-drops.cooldown-seconds, tylko dla dropów z rozgrywki.
  # Każda z czterech kategorii (farming / lapis / fishing / monsters) ma
  # WŁASNY licznik na chunk, więc okna nie zjadają się nawzajem.
  #
  # Po co, skoro szanse są niskie: bo szansa steruje wartością zdarzenia, a nie
  # ich liczbą. Przychód to (zdarzeń/s) × (wartość zdarzenia), a pierwszego
  # czynnika config dotąd tu w ogóle nie dotykał — dokładnie ten sam błąd, który
  # F8 naprawiła w generatorze. Przy tempie odniesienia okno NIE WIĄŻE
  # (rolnictwo 3,6 dropu/h przy limicie 15), więc normalna gra go nie widzi;
  # wiąże dopiero pod autoklikerem i przy ścianie rąk jednej wyspy.
  #
  # 3600/240 = 15 dropów/h na chunk i kategorię. 0 wyłącza okno.
  cooldown-seconds: 240
  fishing:
    aquamarine: 1.5    # 1.5% szansy na Akwamaryn Głębin (skyblock:crystal/aquamarine) przy wyłowieniu ryby
  farming:
    # F14: 0,8 -> 0,1. Ta sama reguła co przy minionkach
    # (minions.yml:balance.bonus-share-max) i przy krysztale generatora
    # (F8): kryształ bonusowy to najwyżej ~20 % przychodu swojego źródła.
    #
    # Wzór: szansa[%] = 100 × 0,60 / cena skupu ze `shop` (600 za perydot).
    #
    # Przy 0,8 % perydot dawał 4,80 coins na KAŻDY zbiór dojrzałej uprawy —
    # więcej niż sama pszenica (3,00) — czyli 17 280 coins/h przy tempie
    # odniesienia, z jednej linijki configu i bez żadnego ogranicznika tempa.
    # Rekomendację postawiła F8 (rozdział 7), tu jest wykonana.
    peridot: 0.1
  lapis:
    opal: 2.0       # 2.0% szansy na Opal Astralny (skyblock:crystal/opal) przy wykopaniu rudy lapisu
  monsters:
    ruby: 0.5       # 0.5% szansy na Nieskazitelny Rubin (skyblock:crystal/ruby) po zabiciu potwora przez gracza
    skeleton_key: 0.2 # 0.2% szansy na Kościany Klucz (skyblock:key/skeleton_key) po zabiciu potwora przez gracza

# Skrzynie na spawnie obsluguje CrazyCrates (fork crazycrates-wpme), nie ten plugin.
# Sekcja `crates:` zostala stad wycięta 2026-08-31 razem z CrateKeyListener,
# CratePreviewMenu i HubCrates — zrodla w reference/skyblock-crates/.
#
# NIE PRZYWRACAJ jej samym plikiem na serwerze: ConfigUpdater dopisuje kazdy klucz
# brakujacy wzgledem TEGO pliku, wiec dopoki sekcji tu nie ma, na serwerze tez jej
# nie bedzie — a gdyby wrocila, oba tory nasluchiwalyby tego samego klikniecia
# (my HIGH, CrazyCrates HIGHEST) i gracz dostalby dwa podglady naraz.
#
# Definicje skrzyn: de964636/plugins/CrazyCrates/crates/Skyblock*.yml

# Tablice wyników na spawnie. Współrzędne nie są zgadnięte: teren przeanalizowano
# odczytem regionów świata. Grunt na obu stanowiskach leży równo na Y=79
# (dirt_path), bryła 80..87 jest pusta, a linia wzroku z oka gracza na spawnie
# (26.5, 83.6, -0.5) do obu tablic jest wolna od przeszkód. Tablice stoją
# symetrycznie po 7 kratek od osi z=-0.5, więc nie zasłaniają hologramu
# Migracja do FancyHolograms: tablice są teraz w pełni rysowane przez FancyHolograms
# z użyciem tokenów %skyblock_board_*%, bez niepotrzebnych encji Display z kodu.
leaderboards:
  enabled: true
  refresh-seconds: 60
  # P0-2 (2026-09-05, decyzja właściciela: 5 wierszy): repo i produkcja mają
  # zgodnie 5 — wcześniejszy komentarz F30 twierdził, że „produkcja ma 10”,
  # ale oba configi pokazują 5 (prod: config.yml:1047). Tokeny
  # %skyblock_board_*_6..10% zostają puste z definicji; gdyby tablica miała
  # urosnąć do 10, zmienić obie strony naraz i sprawdzić monument.
  entries: 5
  # Wielkość całej tablicy naraz: tekst, głowy i odstępy między wierszami.
  # Dopasowana do powierzchni gładkiego piaskowca w ramce monumentu.
  scale: 1.05
  boards:
    season:
      source: season
      world: world
      x: 23.4
      y: 97.0
      z: -3.5
      yaw: -90.0
      pitch: 0.0
      billboard: FIXED
      title: "<gradient:#ffd700:#ff8c00><bold>RANKING SEZONU</bold></gradient>"
      metric: "punkty"
    hall-of-fame:
      source: all-time
      world: world
      x: 23.4
      y: 97.0
      z: 6.5
      yaw: -90.0
      pitch: 0.0
      billboard: FIXED
      title: "<gradient:#b39ddb:#7e57c2><bold>HALL OF FAME</bold></gradient>"
      metric: "wygrane sezony"
  # Oprawa pod tablicą: podłoga 3x7 i ciemna ściana za plecami. WYŁĄCZONA,
  # odkąd tablice stoją na monumencie zbudowanym przez autora mapy — kamienna
  # ściana pluginu dostawiona do gotowej architektury wyglądała jak łata.
  # Kontrast tekstu zapewnia półprzezroczyste tło samego TextDisplay
  # (0x62050A10), nie ściana. Reszta ustawień zostaje na wypadek powrotu.
  #
  # Plugin podmienia WYŁĄCZNIE goły teren (HubPedestal.EXPENDABLE: powietrze,
  # ziemia, ścieżka, trawa, żwir, piasek) — nigdy bloku postawionego przez
  # gracza czy budowniczego. Warstwa pod podłogą zostaje nietknięta.
  #
  # F30 (domyka F9/F27): trzy materiały poniżej dociągnięte do produkcji, która
  # dobrała je pod paletę monumentu. Sekcja jest wyłączona po obu stronach, więc
  # zmiana jest bezskutkowa w czasie działania — chodzi o to, żeby porównanie
  # repo↔produkcja przestało co przebieg zgłaszać tę samą nierozstrzygniętą
  # trójkę. Żaden z nich nie należy do EXPENDABLE, więc podest nadal nie
  # nadpisuje sam siebie (HubPedestalTest).
  pedestal:
    enabled: false
    floor: ANDESITE
    wall: STONE_BRICKS
    accent: SPRUCE_PLANKS
    light: SHROOMLIGHT
    # Ile kratek chodnika położyć od tablicy w stronę spawnu. Nadmiar jest
    # bezpieczny: lista dozwolonych materiałów zatrzyma chodnik na krawędzi
    # istniejącej budowli, zamiast ją nadpisać.
    approach: 4

# ── Nagrody sezonowe ────────────────────────────────────────────────────────
# Kto i kiedy może odebrać nagrodę za TOP 3 wysp.
#
# Sam warunek "miejsce w TOP 3" nie wystarcza. Ranking liczy się na żywo, więc
# dopóki na serwerze jest mniej wysp niż miejsc na podium, KAŻDA wyspa jest
# w TOP 3 — z wynikiem zero. Bez tych progów limitowany komplet kosmetyki
# sezonu wyszedłby w pierwszej godzinie po starcie i nigdy już nie byłby
# limitowany, a roszczenie liczy się per gracz, nie per wyspa, więc mnożyłoby
# się przez liczbę członków wyspy.
seasons:
  # Okno odbioru. Domyślnie ZAMKNIĘTE i takie ma zostać przez cały sezon.
  # Otwierasz je dopiero wtedy, gdy sezon jest rozstrzygnięty. Pomyłka w stronę
  # "true" jest nieodwracalna, pomyłka w stronę "false" to jedna linijka.
  rewards-claimable: false
  # Najmniejszy dorobek, który w ogóle liczy się jako wynik. Wyspa poniżej progu
  # nie jest na podium, choćby była jedyna na serwerze.
  min-score: 1
  # Ile wysp Z DOROBKIEM musi być w rankingu, żeby podium coś znaczyło.
  # Liczone są wyspy powyżej min-score, bo puste konto łatwo założyć.
  min-ranked-islands: 5
  # P2-4: wyspa poza podium z wynikiem (bank + 500 × zadania) ≥ progu odbiera nagrodę
  # rank 4 z season.top-rewards i 1 część kolekcji (cosmetics.yml top-rewards.4).
  # 2 500 = np. 1 500 w banku + 2 zadania. 0 wyłącza próg (tylko podium).
  threshold-score: 2500

# ── Codzienna nagroda i seria logowań ───────────────────────────────────────
# Dzień = data UTC. Odbiór automatyczny 2 s po wejściu, ręcznie /nagroda.
# Kwota = base-coins + per-streak-day × min(seria, streak-cap); przy domyślnych
# 250 + 50 × 7 = 600 monet od 7. dnia serii. Co 7. dzień serii dodatkowo
# 1 × custom-item (Srebrny Lotos) przez outbox ekwipunku. Przerwa choćby
# jednego dnia zeruje serię do 1 — innej kary nie ma.
# Bonus rangi: węzeł skyblockgameplay.daily.bonus.<pct> (RankPerks), nadawany
# w LuckPerms z kontekstem server=skyblock (vip 10, svip 20, sponsor 30, legend 50).
daily-reward:
  enabled: true
  base-coins: 250
  per-streak-day: 50
  streak-cap: 7
  custom-item: skyblock:token/silver_lotus

# Poziom wyspy — nasza liczba (Skyllia nie zna poziomu). Liczony z trwałego dorobku:
#   xp = (bank + 500 × zadania) / score-divisor
#      + minionki × minion-xp
#      + indeks rozdziału OneBlocka × chapter-xp
#      + punkty sezonowe członków × season-point-xp
# Poziom n wymaga base × n^1.5 xp (n=1 → 500, n=10 → ~15 800, n=100 → 500 000).
# Awans na poziom n wpłaca reward-per-level × n monet do banku wyspy — raz na poziom
# (idempotentnie po txId), zapisany poziom nigdy nie spada. Przeliczenie co
# refresh-seconds dla wysp graczy online oraz na klik w Centrum Wyspy.
island-level:
  base: 500
  max-level: 100
  score-divisor: 100
  minion-xp: 250
  chapter-xp: 500
  season-point-xp: 2
  reward-per-level: 200
  refresh-seconds: 60

# Migracja na pluginy Eco (2026-09-07): zadania dzienne i sezonowe → EcoQuests, karnet →
# EcoBattlepass, minionki → EcoPets. Gdy true: nasze moduły zadań/questów sezonowych nie
# rejestrują listenerów ani nie liczą postępu (punkty sezonu przyznaje EcoQuests komendą
# `sezon admin punkty`), /zadania otwiera Księgę Zadań EcoQuests, /przepustka i /sezon pass
# otwierają karnet EcoBattlepass, a premium kupuje się przez `/przepustka premium`.
eco-migration:
  enabled: true
