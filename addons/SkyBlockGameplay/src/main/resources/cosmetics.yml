# Kolekcje kosmetyczne SkyBlocka.
#
# Sezony są eventowe: resetują się, wyspy nie. Każdy sezon ma przypisaną jedną
# kolekcję, a każdy wydany egzemplarz nosi znacznik sezonu i zdobytego miejsca,
# więc po samym przedmiocie widać, skąd pochodzi. Dzięki temu "LIMITOWANA
# EDYCJA" z opisu przedmiotu znaczy coś sprawdzalnego.
#
# Egzemplarze są soulbound — bramka handlowa nie pozwoli ich sprzedać ani zużyć
# w kuźni. To celowe: kosmetyka ma zostać dowodem, a nie towarem.
#
# Ten sam katalog obsługuje sprzedaż w sklepie: komenda administracyjna wydaje
# dowolną część z dowolnym znacznikiem, więc płatności nie muszą znać
# wewnętrznych identyfikatorów.
schema-version: 1
enabled: true

# Sezon -> kolekcja. Sezon bez wpisu nie wydaje kosmetyki.
season-collections:
  1: abyss
  2: aquamarine
  3: blood
  4: flowering
  5: forest
  6: love
  7: molten
  8: rainbow
  9: runic
  10: sandnite

# Miejsce w rankingu -> ile części kolekcji dostaje wyspa.
# Cztery to komplet; kolejność wydawania jest taka jak w "pieces".
top-rewards:
  1: 4
  2: 2
  3: 1
  # P2-4: próg sezonu (wirtualne 4. miejsce) — 1 część kolekcji dla każdej wyspy nad progiem.
  4: 1
  # 2026-09-10: TOP 10 — 1 część kolekcji. Miejsce 50 nie ma części, dostaje tytuł wyspy.
  10: 1

collections:
  abyss:
    name: "<dark_purple><bold>Set Otchłani</bold></dark_purple>"
    core: mystical_core_abyss
    content-version: 1
    pieces:
      - mystical_abyss_helmet
      - mystical_abyss_chestplate
      - mystical_abyss_leggings
      - mystical_abyss_boots

