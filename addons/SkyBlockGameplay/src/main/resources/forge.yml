    #
    # Wyprowadzenie — z reguły, która już stała w minions.yml:balance, tylko
    # nikt nie przyłożył jej do paliwa. Zwrot inwestycji w minionka ma leżeć
    # w paśmie 30–80 h RÓWNIEŻ przy stale podpiętym paliwie:
    #     inwestycja / (1,5 × przychód_T5 − cena_paliwa / 12 h) >= 30 h
    # Wiążący jest minionek diamentu (inwestycja 3 720 000 monet, przychód
    # 89 994 coins/h): cena >= 12 × (1,5 × 89 994 − 3 720 000/30) = 131 892.
    # Drugi w kolejce szmaragd wymaga 95 844. Najmniejsza okrągła liczba, która
    # spełnia oba przy KONSERWATYWNYM liczeniu bramki (samo cost-money, bez
    # składników) to 140 000 za sztukę, czyli 280 000 za partię dwóch.
    #
    # Ile było przedtem: 27 110 coins-eq/szt. dawało minionkowi diamentu zwrot
    # 28,0 h, a szmaragdowi 28,4 h — oba PONIŻEJ własnego progu 30 h.
    #
    # Pełny łańcuch: 284 220 coins-eq = 11,4 h, pod sufitem 50 h. Bursztyn ze
    # skrzyń (Tytanów 12 % × 8, Podziemi 8 % × 2) jest tym samym ruchem wart
    # 142 110 coins-eq za sztukę — i to on, a nie kuźnia, jest drogą tanią.
    cost-money: 280000
    required-items:
      - item: "custom:skyblock:crystal/citrine"
        amount: 8
      - item: "BLAZE_ROD"
        amount: 4
      - item: "LAVA_BUCKET"
        amount: 1

  # --- Minionki -------------------------------------------------------------
  # Cena wejścia jest policzona, nie zgadnięta: to około 50 godzin przychodu
  # danego minionka na 1. poziomie po cenach skupu ze sklepu. Dzięki temu żaden
  # typ nie jest matematycznie lepszy od pozostałych — wybór to kwestia tego,
  # jakiego surowca potrzebujesz, a nie tego, który typ szybciej się zwraca.
  # Każda receptura żąda kryształu ze źródła NIEZALEŻNEGO od minionków
  # (stoniarka, plony, łowienie, kuźnia), żeby nie powstała pętla, w której
  # minionek jest potrzebny do zdobycia minionka.

