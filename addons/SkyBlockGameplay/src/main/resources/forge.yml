# Kuźnia Mistrzowska & Kantor Wymiany.
#
# cost-money jest w CAŁYCH monetach. Ekonomia SkyBlocka nie zna groszy:
# Ui.money(long) renderuje wartość surowo, a "% 100" w tej metodzie to polska
# reguła liczby mnogiej (wyjątek 12-14), nie przelicznik jednostek.
#
# Prefiks "custom:" wskazuje przedmiot z CustomItems; brak prefiksu oznacza
# zwykły Material. Nieznany identyfikator wywala plugin przy starcie, a nie
# przy pierwszym kliknięciu gracza.
schema-version: 1

# ── Kontrakt zlewu (F17) ───────────────────────────────────────────────────
# Sekcja czytana WYŁĄCZNIE przez bramkę budowania (ForgeEconomyBalanceTest),
# nigdy przez runtime — tak samo jak `balance` w oneblock.yml, minions.yml
# i config.yml.
#
# Dwie reguły, bo są dwa rodzaje receptur:
#
#  1. Receptura, która NIC NIE ODBLOKOWUJE (klucz, żeton, płyta, kosmetyk) to
#     czysty zlew. Jej cena nie ma czego zwracać, więc jedynym ogranicznikiem
#     jest czas gracza: pełny łańcuch (monety wszystkich kroków + składniki po
#     cenach skupu) nie może przekroczyć 50 h przychodu docelowego, czyli
#     50 × config.yml:balance.target-coins-per-hour = 1 250 000 coins-eq.
#     Skąd 50 h: to jedyna reguła cenowa zapisana w tym repo (komentarz przy
#     minionkach niżej, minions.yml:balance) i jedyna liczba, którą F14 użyła
#     do walidacji celu 25 000 coins/h.
#
#  2. Receptura na MINIONKA odblokowuje przychód, więc rządzi nią zwrot, a nie
#     sufit — pasmo 30–80 h pilnuje MinionEconomyBalanceTest z minions.yml.
#     Dlatego minionek diamentu wolno mieć droższy niż 50 h (pełny łańcuch
#     2 168 836 coins-eq = 86,8 h): zwraca się w 48 h i to jest jego kontrakt.
balance:
  # 50 h × 25 000 coins/h. Zmiana target-coins-per-hour w config.yml wymaga
  # przeliczenia tej liczby — bramka nie zgaduje.
  max-coins-eq-per-recipe: 1250000
  # Ile godzin przychodu docelowego odpowiada sufitowi wyżej. Bramka używa jej
  # tylko w komunikacie błędu, żeby liczba w monetach miała obok siebie tę
  # w godzinach.
  max-hours-per-recipe: 50

# ── Zniżka rangowa (F17) ───────────────────────────────────────────────────
# Jedyna korzyść rangi wpuszczona na tempo rozwoju wyspy (decyzja właściciela
# 2026-08-31, docs/ranks.yml). Świadomie po stronie ZLEWU, nie kranu:
# mnożnik przychodu ×1,10 dokłada monety do obiegu i kumuluje się przez
# minionki (F14, rozdział 6.3), a zniżka nie robi ani jednego, ani drugiego —
# nie drukuje monet, więc żaden sufit z config.yml nie wymaga przeliczenia.
#
# Działa na `cost-money` KAŻDEGO kroku łańcucha (płyty, klucze, wejście
# minionka), bo każdy krok to osobne kliknięcie w kuźni. NIE działa na
# ulepszenia tierów minionka (minions.yml) — te płaci wspólny bank wyspy,
# a zniżka per gracz na koszcie dzielonym znaczyłaby „zaproś sponsora na
# zastępcę, a cała wyspa kupuje taniej”.
#
# LISTA, nie mapa — i to nie jest kwestia gustu: ConfigurationSection traktuje
# kropkę w kluczu jako separator ścieżki, więc `skyblockgameplay.forge...: 15`
# wczytałoby się jako zagnieżdżona sekcja, a nie jako jeden węzeł. Ten sam
# powód, dla którego `required-items` niżej jest listą map.
#
# Sprawdzane od najwyższego procentu, wygrywa pierwsze trafienie — legend
# dziedziczy po sponsorze i ma zapłacić stawkę legendy, nie sponsora.
# Zakres 1..50; poza nim plugin odmawia startu (literówka 100 zrobiłaby kuźnię
# darmową). Uprawnienia nadawane z kontekstem `server=skyblock`.
#
# Ile to daje: pełna ścieżka rozwoju (5× minionek diamentu + Klucz Wolframowy
# + Napierśnik Otchłani) to 12 750 000 monet zapłaconych w kuźni = 510 h przy
# 25 000 coins/h. Zniżka 10 % oszczędza 1 275 000 monet = 51 h, zniżka 15 % —
# 1 912 500 monet = 76,5 h.
discounts:
  - permission: "skyblockgameplay.forge.discount.legend"
    percent: 15
  - permission: "skyblockgameplay.forge.discount.sponsor"
    percent: 10
  - permission: "skyblockgameplay.forge.discount.svip"
    percent: 8
  - permission: "skyblockgameplay.forge.discount.vip"
    percent: 5

