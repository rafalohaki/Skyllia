# Baza współdzielona z SkyBlockGameplay (izolowany SQLite) — ta sama tabela
# wpme_sb_minions, więc migracja danych nie jest potrzebna.
database:
  jdbc-url: 'jdbc:sqlite:plugins/SkyBlockGameplay/skyblock-gameplay.db?busy_timeout=5000&foreign_keys=on&journal_mode=WAL&synchronous=FULL'
  pool:
    maximum-pool-size: 2
    minimum-idle: 1
    queue-capacity: 256
    connection-timeout-ms: 5000

# Perki prestiżu wyspy (SkyBlockGameplay zapisuje poziom do
# wpme_sb_island_prestige we współdzielonej bazie — ten sam plik co wyżej).
prestige:
  # +1 slot minionka co N poziomów prestiżu wyspy; 0 = bonus wyłączony.
  minion-slots-every-levels: 2

# Ulepszenia wyspy (SkyBlockGameplay, island.upgrades.minions — tor `minions`
# w wpme_sb_island_upgrades): +N slotów za każdy kupiony poziom.
# MUSI być równe slots-per-level toru minions w configu SkyBlockGameplay.
upgrades:
  slots-per-level: 1
