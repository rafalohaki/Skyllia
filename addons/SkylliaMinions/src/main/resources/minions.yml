schema-version: 1

# Kontrakt balansowy minionków — pilnowany przez bramkę budowania
# (MinionEconomyBalanceTest), nie przez runtime. Do 2026-08-30 te trzy liczby
# były stałymi w kodzie testu, więc nikt poza deweloperem nie mógł ich ruszyć.
balance:
  # Dopuszczalne pasmo zwrotu pełnej inwestycji (receptura w kuźni + wszystkie
  # ulepszenia) liczone po cenach skupu ze sklepu. Reguła całej ekonomii celuje
  # w 50 h; przy bonusie na 20 % przychodu wychodzi ~42 h, więc pasmo zostaje.
  payback-hours-min: 30.0
  payback-hours-max: 80.0
  # F27 (FUEL-1): pasmo wyżej obowiązuje TAKŻE przy stale podpiętym paliwie.
  # Do tej fali nikt nie policzył paliwa w zwrocie, a paliwo jest mnożnikiem
  # przychodu, nie ozdobą: przy dawnej cenie bursztynu (27 110 coins-eq/szt.)
  # minionek diamentu zwracał się z paliwem w 28,0 h, a szmaragdu w 28,4 h —
  # OBA poniżej deklarowanego progu 30 h. To nie jest nowa reguła, tylko
  # nieegzekwowana: bramka liczyła zwrot bez paliwa, bo słowo `fuels` w
  # MinionEconomyBalanceTest nie występowało.
  #
  # Warunek jest jednostronny — tylko dolny próg. Paliwo na tanim minionku jest
  # czystą stratą (bruk: 648 coins/h przyrostu przy 11 667 coins/h kosztu) i tak
  # ma być; górnego pasma nie stosujemy, bo „zwrot nigdy” nie jest nadużyciem.
  #
  # MINION-2/3: górny udział kryształu bonusowego w przychodzie minionka na T5.
  # Bonus ma być dodatkiem, nie głównym źródłem — przy 3 % cytrynu bruk T5
  # zarabiał 5 400 coins/h na kryształach przy 360 coins/h z bruku (15×) i
  # zwracał się w 3 h zamiast 50. Wzór na szansę:
  #   bonus-chance[%] = 100 × udział × sell(surowiec) × primary-amount
  #                     / sell(bonus-drop)
  # (interwał się skraca, więc ta sama szansa działa na każdym tierze).
  # T4 dostaje połowę udziału z T5.
  bonus-share-max: 0.20

settings:
  max-minions-per-island: 5
  tick-interval-seconds: 1
  adjacent-chest-scan-radius: 1
  default-storage-slots: 2
  slots-per-tier-increase: 2

# ── Paliwa (F27) ───────────────────────────────────────────────────────────
# Bursztyn Kuźni jest JEDYNYM paliwem. Trzy paliwa waniliowe wypadły
# 2026-09-01, każde z własnego powodu — i oba powody to reguły, które już tu
# stały, tylko nikt ich do paliwa nie przyłożył.
#
#  * COAL i COAL_BLOCK łamały MINION-1 wprost: `minion_coal` produkuje COAL,
#    a `compact-mappings: COAL → COAL_BLOCK` niżej robi z dziewięciu sztuk
#    blok. Minionek węgla na T5 daje 327 sztuk/h, czyli 36 bloków/h, czyli
#    291 godzin paliwa ×1,20 na godzinę pracy — przy zapotrzebowaniu wyspy
#    5 godzin paliwa na godzinę. Jeden minionek węgla napędzał całą wyspę,
#    za darmo i bez końca. Dokładnie ta pętla, dla której MINION-1 powstała.
#
#  * LAVA_BUCKET nie da się wycenić jako paliwa, bo jego cena należy do innego
#    poddziału: to WSAD GENERATORA (`shop.utility.lava_bucket buy: 400`,
#    `generator.balance` liczy generator „za wiadro lawy”). 400 monet dawało
#    24 h ×1,25, czyli 539 964 monet przyrostu na minionku diamentu T5 —
#    pętla monety→paliwo→monety o krotności 1350×. Podniesienie ceny wiadra
#    zepsułoby generator, więc wiadro przestaje być paliwem.
#
# Zostaje bursztyn, którego cenę ustala kuźnia (`forge.yml:amber_catalyst_fuel`)
# i którego dodatkowym źródłem są skrzynie. Żaden minionek go nie produkuje —
# ani jako surowca, ani jako `bonus-drop` (dąb dostał perydot w F14).
fuels:
  amber_catalyst:
    custom-item: "skyblock:crystal/amber"
    duration-seconds: 43200
    speed-multiplier: 1.50

compact-mappings:
  COAL: COAL_BLOCK
  IRON_INGOT: IRON_BLOCK
  COPPER_INGOT: COPPER_BLOCK
  GOLD_INGOT: GOLD_BLOCK
  REDSTONE: REDSTONE_BLOCK
  LAPIS_LAZULI: LAPIS_BLOCK
  DIAMOND: DIAMOND_BLOCK
  EMERALD: EMERALD_BLOCK
  NETHERITE_INGOT: NETHERITE_BLOCK
  WHEAT: HAY_BLOCK
  SLIME_BALL: SLIME_BLOCK

# Koszty ulepszeń wynikają z reguły, nie z wyczucia: każdy poziom kosztuje
# około 50 godzin przychodu, który odblokowuje, licząc po cenach skupu ze
# sklepu. Tę samą regułę stosuje cena wejścia w kuźni (forge.yml), więc każdy
# minionek zwraca się w podobnym czasie i żaden typ nie jest matematycznie
# lepszy od pozostałych. Zmieniając interwał albo cenę skupu — przelicz koszty.
#
# MINION-1: żaden minionek NIE MOŻE dropić ani produkować paliwa minionków.
# Dąb dawał `skyblock:crystal/amber` (12 h, ×1,50 — najlepsze paliwo w grze,
# bez ceny w sklepie): ~16 amberu/h to 192 minionko-godziny premium na godzinę,
# czyli pętla „minionek napędza sam siebie”. Dąb dostał perydot, który pasuje
# tematycznie (plony) i ma cenę skupu, więc bramka parytetu potrafi go w ogóle
# policzyć.
#
# F27: reguła obejmuje teraz także `primary-item` i jego odpowiednik z
# `compact-mappings` — to tamtędy przechodził minionek węgla (COAL i
# COAL_BLOCK były paliwami). Bursztyn pochodzi z kuźni i ze skrzyń; skrzynia
# nie jest minionkiem, a jej klucze wymagają surowego wolframu i umbry, których
# ŻADEN minionek nie produkuje — pętla jest przerwana konstrukcyjnie, nie
# wyceną.
